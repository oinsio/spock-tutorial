plugins {
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {

    // Spock Framework
    testImplementation 'org.spockframework:spock-core:2.4-M6-groovy-4.0'
    testImplementation 'org.apache.groovy:groovy-all:4.0.32'

    // Additional test dependencies
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.testcontainers:localstack:1.21.4'
    testImplementation 'org.testcontainers:spock:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'ch.qos.logback:logback-classic:1.5.38'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // Lombok
    implementation 'org.projectlombok:lombok:1.18.46'

    // Redis client
    implementation 'io.lettuce:lettuce-core:7.6.0.RELEASE'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.48.0')
    implementation 'software.amazon.awssdk:s3'

    // DynamoDB
    implementation 'software.amazon.awssdk:dynamodb'

    // MockServer
    testImplementation 'org.testcontainers:mockserver:1.21.4'
    implementation 'org.mock-server:mockserver-client-java:5.15.0'

    // PITest with JUnit 5 support
    pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    finalizedBy 'pitest'
}

jacocoTestReport {
    dependsOn test
}

pitest {
    pitestVersion = '1.25.7'
    junit5PluginVersion = '1.0.0'
    targetClasses = ['com.mechanitis.*']
    threads = 4
    timestampedReports = false
}
